<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory System</title>
  </head>
  <body>
    <div id="root">
  <div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;background:#0f172a;gap:12px;">
    <div style="width:40px;height:40px;border:4px solid #334155;border-top-color:#6366f1;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    <p style="color:#94a3b8;font-size:14px;font-family:sans-serif;">Loading Inventory...</p>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</div>
  </body>
</html>
